          python live_engine/06_ondemand_runner.py --imdb "$TARGET_IMDB" || true

          echo "📦 [LANGKAH 2/2] Menjalankan Fallback Pakej Arkib ZIP (B2 & TG Redis)..."
          python live_engine/10_fallback_zip_pack_importer.py --imdb "$TARGET_IMDB"

      # =========================================================================
      # LANGKAH 4: COMMIT & REBASE PENJEJAK REKOD TEMPATAN & SQLITE SUBSOURCE
      # =========================================================================
      - name: Commit dan Simpan Rekod SQLite & History (Auto-Rebase Safe)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          TARGET_IMDB="${{ github.event.client_payload.imdb_id || inputs.imdb_id }}"
          
          # 1. Gabungkan jurnal WAL SQLite ke fail fizikal sebelum staging
          python3 -c "import sqlite3, os; [sqlite3.connect(f).execute('PRAGMA wal_checkpoint(TRUNCATE);').close() for f in ['live_engine/data/stremio_cache.db', 'sub_engine/data/subsource_cache.db'] if os.path.exists(f)]" 2>/dev/null || true

          # 2. Pantau perubahan pada berkas SQLite dan riwayat JSON
          [ -f "live_engine/data/stremio_cache.db" ] && git add live_engine/data/stremio_cache.db
          [ -f "live_engine/data/scraped_history.json" ] && git add live_engine/data/scraped_history.json
          [ -f "sub_engine/data/subsource_cache.db" ] && git add sub_engine/data/subsource_cache.db

          if ! git diff --cached --quiet; then
            git commit -m "auto: update cache databases & history for $TARGET_IMDB [skip ci]"
            
            # 3. Buang sebarang perubahan sementara fail lain agar ruang kerja 100% bersih
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true

            # 4. Mekanisme dorong aman dengan rebase dan fallback merge (Polisi 05_process_cloud_to_b2)
            for i in {1..3}; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin main; then
                  echo "✅ Berjaya segerakkan rekod SQLite & history ke GitHub!"
                  exit 0
                fi
              else
                git rebase --abort 2>/dev/null || true
                # Fallback merge aman menghindari kegagalan konflik komit
                git pull origin main --no-rebase -X ours --no-edit
                if git push origin main; then
                  echo "✅ Berjaya merge & push rekod ke GitHub!"
                  exit 0
                fi
              fi
              echo "⚠️ Percubaan $i gagal kerana remote dikemas kini, mencuba semula..."
              sleep 2
            done
            exit 1
          else
            echo "ℹ️ Tiada perubahan status rekod dikesan."
          fi