name: 01 On-Demand Subtitle Scrape

on:
  repository_dispatch:
    types: [ondemand_scrape]
  workflow_dispatch:
    inputs:
      imdb_id:
        description: 'IMDb ID untuk diuji (contoh: tt0145487)'
        required: true
        default: 'tt0145487'

jobs:
  scrape-ondemand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Muat turun sejarah penuh untuk sokongan git rebase
          
      - name: Sediakan Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Pustaka Dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sediakan Cache Binari Camoufox
        id: cache-camoufox
        uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Muat Turun Binari Pelayar Camoufox
        run: |
          python -m camoufox fetch

      - name: Jalankan Skrip On-Demand Scraper & Fallback Arkib ZIP
        env:
          CF_WORKER_B2_STORAGE: ${{ secrets.CF_WORKER_B2_STORAGE }}
          ADDON_SECRET_TOKEN: ${{ secrets.ADDON_SECRET_TOKEN }}

          # Kunci Utama JSON Multi-Akaun Upstash Redis (10 Akaun Sharded)
          REDIS_MULTI_ACCOUNT_JSON: ${{ secrets.REDIS_MULTI_ACCOUNT_JSON }}

          # Kunci Sandaran Redis Asal (Legacy Fallback)
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

          # Kunci Khas TG Upstash Redis (Pemetaan Pakej Arkib ZIP Cold Storage)
          TG_UPSTASH_REDIS_REST_URL: ${{ secrets.TG_UPSTASH_REDIS_REST_URL }}
          TG_UPSTASH_REDIS_REST_TOKEN: ${{ secrets.TG_UPSTASH_REDIS_REST_TOKEN }}
          
          # Kunci Utama (JSON Format - Semua Akaun B2)
          B2_MULTI_ACCOUNT_JSON: ${{ secrets.B2_MULTI_ACCOUNT_JSON }}

          # Kunci Sandaran B2 (Legacy Fallback)
          # B2 ACC 1 - 5
          B2_ACC1_KEY_ID: ${{ secrets.B2_ACC1_KEY_ID }}
          B2_ACC1_APP_KEY: ${{ secrets.B2_ACC1_APP_KEY }}
          B2_ACC1_BUCKET_NAME: ${{ secrets.B2_ACC1_BUCKET_NAME }}
          B2_ACC1_BUCKET_ID: ${{ secrets.B2_ACC1_BUCKET_ID }}
          B2_ACC1_S3_API_ENDPOINT: ${{ secrets.B2_ACC1_S3_API_ENDPOINT }}
          B2_ACC2_KEY_ID: ${{ secrets.B2_ACC2_KEY_ID }}
          B2_ACC2_APP_KEY: ${{ secrets.B2_ACC2_APP_KEY }}
          B2_ACC2_BUCKET_NAME: ${{ secrets.B2_ACC2_BUCKET_NAME }}
          B2_ACC2_BUCKET_ID: ${{ secrets.B2_ACC2_BUCKET_ID }}
          B2_ACC2_S3_API_ENDPOINT: ${{ secrets.B2_ACC2_S3_API_ENDPOINT }}
          B2_ACC3_KEY_ID: ${{ secrets.B2_ACC3_KEY_ID }}
          B2_ACC3_APP_KEY: ${{ secrets.B2_ACC3_APP_KEY }}
          B2_ACC3_BUCKET_NAME: ${{ secrets.B2_ACC3_BUCKET_NAME }}
          B2_ACC3_BUCKET_ID: ${{ secrets.B2_ACC3_BUCKET_ID }}
          B2_ACC3_S3_API_ENDPOINT: ${{ secrets.B2_ACC3_S3_API_ENDPOINT }}
          B2_ACC4_KEY_ID: ${{ secrets.B2_ACC4_KEY_ID }}
          B2_ACC4_APP_KEY: ${{ secrets.B2_ACC4_APP_KEY }}
          B2_ACC4_BUCKET_NAME: ${{ secrets.B2_ACC4_BUCKET_NAME }}
          B2_ACC4_BUCKET_ID: ${{ secrets.B2_ACC4_BUCKET_ID }}
          B2_ACC4_S3_API_ENDPOINT: ${{ secrets.B2_ACC4_S3_API_ENDPOINT }}
          B2_ACC5_KEY_ID: ${{ secrets.B2_ACC5_KEY_ID }}
          B2_ACC5_APP_KEY: ${{ secrets.B2_ACC5_APP_KEY }}
          B2_ACC5_BUCKET_NAME: ${{ secrets.B2_ACC5_BUCKET_NAME }}
          B2_ACC5_BUCKET_ID: ${{ secrets.B2_ACC5_BUCKET_ID }}
          B2_ACC5_S3_API_ENDPOINT: ${{ secrets.B2_ACC5_S3_API_ENDPOINT }}

          # B2 ACC 6 - 10
          B2_ACC6_KEY_ID: ${{ secrets.B2_ACC6_KEY_ID }}
          B2_ACC6_APP_KEY: ${{ secrets.B2_ACC6_APP_KEY }}
          B2_ACC6_BUCKET_NAME: ${{ secrets.B2_ACC6_BUCKET_NAME }}
          B2_ACC6_BUCKET_ID: ${{ secrets.B2_ACC6_BUCKET_ID }}
          B2_ACC6_S3_API_ENDPOINT: ${{ secrets.B2_ACC6_S3_API_ENDPOINT }}
          B2_ACC7_KEY_ID: ${{ secrets.B2_ACC7_KEY_ID }}
          B2_ACC7_APP_KEY: ${{ secrets.B2_ACC7_APP_KEY }}
          B2_ACC7_BUCKET_NAME: ${{ secrets.B2_ACC7_BUCKET_NAME }}
          B2_ACC7_BUCKET_ID: ${{ secrets.B2_ACC7_BUCKET_ID }}
          B2_ACC7_S3_API_ENDPOINT: ${{ secrets.B2_ACC7_S3_API_ENDPOINT }}
          B2_ACC8_KEY_ID: ${{ secrets.B2_ACC8_KEY_ID }}
          B2_ACC8_APP_KEY: ${{ secrets.B2_ACC8_APP_KEY }}
          B2_ACC8_BUCKET_NAME: ${{ secrets.B2_ACC8_BUCKET_NAME }}
          B2_ACC8_BUCKET_ID: ${{ secrets.B2_ACC8_BUCKET_ID }}
          B2_ACC8_S3_API_ENDPOINT: ${{ secrets.B2_ACC8_S3_API_ENDPOINT }}
          B2_ACC9_KEY_ID: ${{ secrets.B2_ACC9_KEY_ID }}
          B2_ACC9_APP_KEY: ${{ secrets.B2_ACC9_APP_KEY }}
          B2_ACC9_BUCKET_NAME: ${{ secrets.B2_ACC9_BUCKET_NAME }}
          B2_ACC9_BUCKET_ID: ${{ secrets.B2_ACC9_BUCKET_ID }}
          B2_ACC9_S3_API_ENDPOINT: ${{ secrets.B2_ACC9_S3_API_ENDPOINT }}
          B2_ACC10_KEY_ID: ${{ secrets.B2_ACC10_KEY_ID }}
          B2_ACC10_APP_KEY: ${{ secrets.B2_ACC10_APP_KEY }}
          B2_ACC10_BUCKET_NAME: ${{ secrets.B2_ACC10_BUCKET_NAME }}
          B2_ACC10_BUCKET_ID: ${{ secrets.B2_ACC10_BUCKET_ID }}
          B2_ACC10_S3_API_ENDPOINT: ${{ secrets.B2_ACC10_S3_API_ENDPOINT }}
        run: |
          TARGET_IMDB="${{ github.event.client_payload.imdb_id || inputs.imdb_id }}"
          
          echo "🔍 [LANGKAH 1/2] Menjalankan On-Demand Scraper Laman Web..."
          python live_engine/06_ondemand_runner.py --imdb "$TARGET_IMDB" || true

          echo "📦 [LANGKAH 2/2] Menjalankan Fallback Pakej Arkib ZIP (B2 & TG Redis)..."
          python live_engine/10_fallback_zip_pack_importer.py --imdb "$TARGET_IMDB"

      - name: Commit dan Simpan Rekod Penjejak & Scraped History (Smart Merge Safe)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          TARGET_IMDB="${{ github.event.client_payload.imdb_id || inputs.imdb_id }}"

          # 1. Pastikan jurnal WAL SQLite disatukan ke fail fizikal
          python3 -c "
          import sqlite3
          for db in ['live_engine/data/b2_active_synced_tracker.db', 'live_engine/data/stremio_cache.db']:
              try:
                  conn = sqlite3.connect(db)
                  conn.execute('PRAGMA wal_checkpoint(TRUNCATE);')
                  conn.close()
              except Exception:
                  pass
          " 2>/dev/null || true

          # 2. Sandarkan hasil larian runner ini ke folder sementara
          mkdir -p /tmp/sync_backup
          [ -f "live_engine/data/b2_active_synced_tracker.db" ] && cp "live_engine/data/b2_active_synced_tracker.db" /tmp/sync_backup/
          [ -f "live_engine/data/stremio_cache.db" ] && cp "live_engine/data/stremio_cache.db" /tmp/sync_backup/
          [ -f "live_engine/data/scraped_history.json" ] && cp "live_engine/data/scraped_history.json" /tmp/sync_backup/

          # 3. Gelung penyelarasan pintar (Smart In-Memory Data Merge)
          for i in {1..3}; do
            git fetch origin main
            git reset --hard origin/main

            # Cantumkan data baharu runner ke dalam fail terkini dari origin/main
            python3 -c "
            import os, json, sqlite3, shutil
            from pathlib import Path

            # A. Gabungkan b2_active_synced_tracker.db (Baris SQLite)
            bk_db = Path('/tmp/sync_backup/b2_active_synced_tracker.db')
            cur_db = Path('live_engine/data/b2_active_synced_tracker.db')
            cur_db.parent.mkdir(parents=True, exist_ok=True)

            if bk_db.exists():
                if not cur_db.exists():
                    shutil.copy2(bk_db, cur_db)
                else:
                    try:
                        conn = sqlite3.connect(str(cur_db))
                        conn.execute('PRAGMA journal_mode = WAL;')
                        conn.execute(f'ATTACH DATABASE \"{bk_db}\" AS backup_db;')
                        conn.execute('''
                            INSERT OR REPLACE INTO b2_active_synced
                            SELECT * FROM backup_db.b2_active_synced;
                        ''')
                        conn.commit()
                        conn.execute('DETACH DATABASE backup_db;')
                        conn.execute('PRAGMA wal_checkpoint(TRUNCATE);')
                        conn.close()
                    except Exception:
                        shutil.copy2(bk_db, cur_db)

            # B. Gabungkan scraped_history.json (Kunci JSON)
            bk_json = Path('/tmp/sync_backup/scraped_history.json')
            cur_json = Path('live_engine/data/scraped_history.json')
            
            cur_data = {}
            if cur_json.exists():
                try:
                    with open(cur_json, 'r', encoding='utf-8') as f:
                        cur_data = json.load(f)
                except Exception:
                    cur_data = {}

            if bk_json.exists():
                try:
                    with open(bk_json, 'r', encoding='utf-8') as f:
                        b_data = json.load(f)
                        cur_data.update(b_data)
                except Exception:
                    pass

            with open(cur_json, 'w', encoding='utf-8') as f:
                json.dump(cur_data, f, indent=2, ensure_ascii=False)
            "

            # 4. Stage dan Commit
            [ -f "live_engine/data/b2_active_synced_tracker.db" ] && git add live_engine/data/b2_active_synced_tracker.db
            [ -f "live_engine/data/scraped_history.json" ] && git add live_engine/data/scraped_history.json

            if git diff --cached --quiet; then
              echo "ℹ️ Tiada perubahan rekod penjejak baharu untuk di-push."
              exit 0
            fi

            git commit -m "auto: update active sync tracker & history for $TARGET_IMDB [skip ci]"

            if git push origin main; then
              echo "✅ Berjaya sync rekod secara atomik ke GitHub!"
              exit 0
            fi

            echo "⚠️ Percubaan $i ditolak kerana remote berubah semasa cantuman, mencuba semula..."
            sleep 2
          done

          exit 1