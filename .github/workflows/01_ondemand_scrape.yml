          # B2 ACC 16 - 20
          B2_ACC16_KEY_ID: ${{ secrets.B2_ACC16_KEY_ID }}
          B2_ACC16_APP_KEY: ${{ secrets.B2_ACC16_APP_KEY }}
          B2_ACC16_BUCKET_NAME: ${{ secrets.B2_ACC16_BUCKET_NAME }}
          B2_ACC16_BUCKET_ID: ${{ secrets.B2_ACC16_BUCKET_ID }}
          B2_ACC16_S3_API_ENDPOINT: ${{ secrets.B2_ACC16_S3_API_ENDPOINT }}
          B2_ACC17_KEY_ID: ${{ secrets.B2_ACC17_KEY_ID }}
          B2_ACC17_APP_KEY: ${{ secrets.B2_ACC17_APP_KEY }}
          B2_ACC17_BUCKET_NAME: ${{ secrets.B2_ACC17_BUCKET_NAME }}
          B2_ACC17_BUCKET_ID: ${{ secrets.B2_ACC17_BUCKET_ID }}
          B2_ACC17_S3_API_ENDPOINT: ${{ secrets.B2_ACC17_S3_API_ENDPOINT }}
          B2_ACC18_KEY_ID: ${{ secrets.B2_ACC18_KEY_ID }}
          B2_ACC18_APP_KEY: ${{ secrets.B2_ACC18_APP_KEY }}
          B2_ACC18_BUCKET_NAME: ${{ secrets.B2_ACC18_BUCKET_NAME }}
          B2_ACC18_BUCKET_ID: ${{ secrets.B2_ACC18_BUCKET_ID }}
          B2_ACC18_S3_API_ENDPOINT: ${{ secrets.B2_ACC18_S3_API_ENDPOINT }}
          B2_ACC19_KEY_ID: ${{ secrets.B2_ACC19_KEY_ID }}
          B2_ACC19_APP_KEY: ${{ secrets.B2_ACC19_APP_KEY }}
          B2_ACC19_BUCKET_NAME: ${{ secrets.B2_ACC19_BUCKET_NAME }}
          B2_ACC19_BUCKET_ID: ${{ secrets.B2_ACC19_BUCKET_ID }}
          B2_ACC19_S3_API_ENDPOINT: ${{ secrets.B2_ACC19_S3_API_ENDPOINT }}
          B2_ACC20_KEY_ID: ${{ secrets.B2_ACC20_KEY_ID }}
          B2_ACC20_APP_KEY: ${{ secrets.B2_ACC20_APP_KEY }}
          B2_ACC20_BUCKET_NAME: ${{ secrets.B2_ACC20_BUCKET_NAME }}
          B2_ACC20_BUCKET_ID: ${{ secrets.B2_ACC20_BUCKET_ID }}
          B2_ACC20_S3_API_ENDPOINT: ${{ secrets.B2_ACC20_S3_API_ENDPOINT }}
        run: |
          TARGET_IMDB="${{ github.event.client_payload.imdb_id || inputs.imdb_id }}"
          python live_engine/06_ondemand_runner.py --imdb "$TARGET_IMDB"

      - name: Commit dan Simpan Rekod JSON Terkini (Auto-Rebase Safe)
        if: always() # Sentiasa simpan rekod yang sempat dimuat naik
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          TARGET_IMDB="${{ github.event.client_payload.imdb_id || inputs.imdb_id }}"
          
          if [ -f "live_engine/data/scraped_history.json" ]; then
            git add live_engine/data/scraped_history.json
            if ! git diff --cached --quiet; then
              git commit -m "auto: update scraped_history.json for $TARGET_IMDB [skip ci]"
              
              # Rebase automatik sekiranya remote mempunyai commit baharu semasa scraper sedang berjalan
              for i in {1..3}; do
                git fetch origin main
                if git rebase origin/main; then
                  if git push origin main; then
                    echo "✅ Berjaya sync rekod on-demand history ke GitHub!"
                    exit 0
                  fi
                else
                  git rebase --abort
                  git pull origin main --no-rebase -X ours -m "merge: resolve ondemand history sync for $TARGET_IMDB [skip ci]"
                  if git push origin main; then
                    echo "✅ Berjaya merge & push rekod on-demand history ke GitHub!"
                    exit 0
                  fi
                fi
                echo "⚠️ Percubaan $i gagal kerana remote berubah, mencuba semula..."
                sleep 2
              done
              exit 1
            else
              echo "ℹ️ Tiada perubahan rekod dikesan."
            fi
          fi