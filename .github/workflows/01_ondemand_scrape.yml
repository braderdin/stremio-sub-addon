name: 01 On-Demand Subtitle Scrape

on:
  repository_dispatch:
    types: [ondemand_scrape]
  workflow_dispatch:
    inputs:
      imdb_id:
        description: 'IMDb ID untuk diuji (contoh: tt0145487)'
        required: true
        default: 'tt0145487'

jobs:
  scrape-ondemand:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Had masa dinaikkan ke 3 jam untuk menampung siri TV penuh
    permissions:
      contents: write
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Muat turun sejarah penuh untuk sokongan git rebase selamat
          
      - name: Sediakan Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Pustaka Dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sediakan Cache Binari Camoufox
        id: cache-camoufox
        uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Muat Turun Binari Pelayar Camoufox
        run: |
          python -m camoufox fetch

      # =========================================================================
      # LANGKAH 1: ENJIN BAHARU V3 (01_sub_engine_core.py - OpenSubtitles)
      # =========================================================================
      - name: Jalankan Enjin Baharu V3 (01_sub_engine_core.py)
