name: Experiment Subscene Scraper Diagnostic

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ondemand_scrape]

jobs:
  run-experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi beautifulsoup4 camoufox DrissionPage

      - name: Run Experiment Diagnostic Script
        run: |
          python experiments/test_runner_debug.py

      - name: Upload Debug Log JSON Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-experiment-report
          path: experiments/debug_output.json