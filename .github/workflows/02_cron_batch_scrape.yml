          B2_ACC18_KEY_ID: ${{ secrets.B2_ACC18_KEY_ID }}
          B2_ACC18_APP_KEY: ${{ secrets.B2_ACC18_APP_KEY }}
          B2_ACC18_BUCKET_NAME: ${{ secrets.B2_ACC18_BUCKET_NAME }}
          B2_ACC18_BUCKET_ID: ${{ secrets.B2_ACC18_BUCKET_ID }}
          B2_ACC18_S3_API_ENDPOINT: ${{ secrets.B2_ACC18_S3_API_ENDPOINT }}
          B2_ACC19_KEY_ID: ${{ secrets.B2_ACC19_KEY_ID }}
          B2_ACC19_APP_KEY: ${{ secrets.B2_ACC19_APP_KEY }}
          B2_ACC19_BUCKET_NAME: ${{ secrets.B2_ACC19_BUCKET_NAME }}
          B2_ACC19_BUCKET_ID: ${{ secrets.B2_ACC19_BUCKET_ID }}
          B2_ACC19_S3_API_ENDPOINT: ${{ secrets.B2_ACC19_S3_API_ENDPOINT }}
          B2_ACC20_KEY_ID: ${{ secrets.B2_ACC20_KEY_ID }}
          B2_ACC20_APP_KEY: ${{ secrets.B2_ACC20_APP_KEY }}
          B2_ACC20_BUCKET_NAME: ${{ secrets.B2_ACC20_BUCKET_NAME }}
          B2_ACC20_BUCKET_ID: ${{ secrets.B2_ACC20_BUCKET_ID }}
          B2_ACC20_S3_API_ENDPOINT: ${{ secrets.B2_ACC20_S3_API_ENDPOINT }}
        run: |
          LIMIT="${{ inputs.limit || 15 }}"
          DELAY="${{ inputs.delay || 1.5 }}"
          python live_engine/07_cron_batch_runner.py --limit "$LIMIT" --delay "$DELAY"

      - name: Commit dan Simpan Rekod JSON Terkini (Auto-Rebase Safe)
        if: always() # Sentiasa simpan rekod yang sempat dimuat naik walaupun runner capai had / dibatalkan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Simpan kedua-dua fail rekod sejarah
          [ -f "live_engine/data/scraped_history.json" ] && git add live_engine/data/scraped_history.json
          [ -f "live_engine/data/no_subs_history.json" ] && git add live_engine/data/no_subs_history.json
          
          if ! git diff --cached --quiet; then
            git commit -m "cron: update batch scraped_history & no_subs_history [skip ci]"
            
            # Rebase automatik sekiranya remote mempunyai commit baharu semasa job berjalan
            for i in {1..3}; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin main; then
                  echo "✅ Berjaya sync rekod history ke GitHub!"
                  exit 0
                fi
              else
                git rebase --abort
                git pull origin main --no-rebase -X ours -m "merge: resolve history sync [skip ci]"
                if git push origin main; then
                  echo "✅ Berjaya merge & push rekod history ke GitHub!"
                  exit 0
                fi
              fi
              echo "⚠️ Percubaan $i gagal kerana remote berubah, mencuba semula..."
              sleep 2
            done
            exit 1
          else
            echo "ℹ️ Tiada perubahan rekod dikesan."
          fi