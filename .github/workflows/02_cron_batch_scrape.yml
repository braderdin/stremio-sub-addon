name: 02 Cron Batch Subtitle Scrape

on:
  schedule:
    # Berjalan setiap 2 jam secara automatik
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Jumlah had filem untuk diproses'
        required: false
        default: '15'
      delay:
        description: 'Sela masa antara filem (saat)'
        required: false
        default: '1.5'

jobs:
  scrape-cron-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Muat turun sejarah penuh untuk sokongan git rebase

      - name: Sediakan Persekitaran Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Pustaka Dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sediakan Cache Binari Camoufox
        id: cache-camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Muat Turun Binari Pelayar Camoufox
        run: |
          python -m camoufox fetch

      - name: Jalankan Skrip Cron Batch Scraper
        env:
          CF_WORKER_B2_STORAGE: ${{ secrets.CF_WORKER_B2_STORAGE }}
          ADDON_SECRET_TOKEN: ${{ secrets.ADDON_SECRET_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          B2_ACC1_KEY_ID: ${{ secrets.B2_ACC1_KEY_ID }}
          B2_ACC1_APP_KEY: ${{ secrets.B2_ACC1_APP_KEY }}
          B2_ACC1_BUCKET_NAME: ${{ secrets.B2_ACC1_BUCKET_NAME }}
          B2_ACC1_BUCKET_ID: ${{ secrets.B2_ACC1_BUCKET_ID }}
          B2_ACC1_S3_API_ENDPOINT: ${{ secrets.B2_ACC1_S3_API_ENDPOINT }}
          B2_ACC2_KEY_ID: ${{ secrets.B2_ACC2_KEY_ID }}
          B2_ACC2_APP_KEY: ${{ secrets.B2_ACC2_APP_KEY }}
          B2_ACC2_BUCKET_NAME: ${{ secrets.B2_ACC2_BUCKET_NAME }}
          B2_ACC2_BUCKET_ID: ${{ secrets.B2_ACC2_BUCKET_ID }}
          B2_ACC2_S3_API_ENDPOINT: ${{ secrets.B2_ACC2_S3_API_ENDPOINT }}
          B2_ACC3_KEY_ID: ${{ secrets.B2_ACC3_KEY_ID }}
          B2_ACC3_APP_KEY: ${{ secrets.B2_ACC3_APP_KEY }}
          B2_ACC3_BUCKET_NAME: ${{ secrets.B2_ACC3_BUCKET_NAME }}
          B2_ACC3_BUCKET_ID: ${{ secrets.B2_ACC3_BUCKET_ID }}
          B2_ACC3_S3_API_ENDPOINT: ${{ secrets.B2_ACC3_S3_API_ENDPOINT }}
          B2_ACC4_KEY_ID: ${{ secrets.B2_ACC4_KEY_ID }}
          B2_ACC4_APP_KEY: ${{ secrets.B2_ACC4_APP_KEY }}
          B2_ACC4_BUCKET_NAME: ${{ secrets.B2_ACC4_BUCKET_NAME }}
          B2_ACC4_BUCKET_ID: ${{ secrets.B2_ACC4_BUCKET_ID }}
          B2_ACC4_S3_API_ENDPOINT: ${{ secrets.B2_ACC4_S3_API_ENDPOINT }}
          B2_ACC5_KEY_ID: ${{ secrets.B2_ACC5_KEY_ID }}
          B2_ACC5_APP_KEY: ${{ secrets.B2_ACC5_APP_KEY }}
          B2_ACC5_BUCKET_NAME: ${{ secrets.B2_ACC5_BUCKET_NAME }}
          B2_ACC5_BUCKET_ID: ${{ secrets.B2_ACC5_BUCKET_ID }}
          B2_ACC5_S3_API_ENDPOINT: ${{ secrets.B2_ACC5_S3_API_ENDPOINT }}
        run: |
          LIMIT="${{ inputs.limit || 15 }}"
          DELAY="${{ inputs.delay || 1.5 }}"
          python live_engine/07_cron_batch_runner.py --limit "$LIMIT" --delay "$DELAY"

      - name: Commit dan Simpan Rekod JSON Terkini (Auto-Rebase Safe)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f "live_engine/data/scraped_history.json" ]; then
            git add live_engine/data/scraped_history.json
            if ! git diff --cached --quiet; then
              git commit -m "cron: update batch scraped_history.json [skip ci]"
              
              # Rebase automatik sekiranya remote mempunyai commit baharu semasa job berjalan
              for i in {1..3}; do
                git fetch origin main
                if git rebase origin/main; then
                  if git push origin main; then
                    echo "✅ Berjaya sync rekod history ke GitHub!"
                    exit 0
                  fi
                else
                  git rebase --abort
                  git pull origin main --no-rebase -X ours -m "merge: resolve history sync [skip ci]"
                  if git push origin main; then
                    echo "✅ Berjaya merge & push rekod history ke GitHub!"
                    exit 0
                  fi
                fi
                echo "⚠️ Percubaan $i gagal kerana remote berubah, mencuba semula..."
                sleep 2
              done
              exit 1
            else
              echo "ℹ️ Tiada perubahan rekod dikesan."
            fi
          fi